name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package backend
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, test and build
        working-directory: frontend
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build

  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-compose-validation-only
        run: docker compose config --quiet

  openapi-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_blog
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: contract-check-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d personal_blog"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start API
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/personal_blog
          DB_USERNAME: blog
          DB_PASSWORD: contract-check-only
        run: |
          ./mvnw -B -DskipTests spring-boot:run > ../backend-openapi.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:8080/actuator/health && exit 0
            sleep 2
          done
          cat ../backend-openapi.log
          exit 1
      - name: Check generated OpenAPI types
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm check:types
